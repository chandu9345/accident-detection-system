data:
  train_dir: data/accident_dataset/train
  val_dir:   data/accident_dataset/val
  test_dir:  data/accident_dataset/test
  image_size: [224, 224]
  batch_size: 32
  class_names:
    - accident
    - non accident

model:
  backbone: mobilenetv2
  dropout: 0.3
  num_classes: 2

training:
  epochs: 20
  learning_rate: 0.001
  save_path: models/image_model.h5